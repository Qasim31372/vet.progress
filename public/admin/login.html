<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Mafaza-tul-Hayat-al-Hewan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased">

  <!-- Header -->
  <header class="p-6 border-b border-slate-800">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <span class="font-bold text-lg text-white">Mafaza-tul-Hayat-al-Hewan</span>
          <span class="text-[10px] block text-indigo-400 font-bold">SYSTEM ADMINISTRATOR ACCESS</span>
        </div>
      </a>
      <a href="/" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1.5 bg-slate-900 px-3.5 py-2 rounded-lg border border-slate-800">
        <i class="fa-solid fa-arrow-left"></i> Public Portal
      </a>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="max-w-md w-full mx-auto px-4 py-12">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
      
      <div class="text-center">
        <div class="w-16 h-16 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl flex items-center justify-center mx-auto text-indigo-400 text-3xl mb-3">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-white">System Administrator</h1>
        <p class="text-xs text-indigo-400 mt-1 font-medium">Log in to review and publish case studies</p>
      </div>

      <!-- Quick Admin Credentials Box -->
      <div class="bg-indigo-950/60 border border-indigo-800/50 p-3.5 rounded-2xl text-xs text-indigo-200">
        <p class="font-bold flex items-center gap-1.5 text-indigo-300">
          <i class="fa-solid fa-key"></i> Default Administrator Credentials:
        </p>
      </div>

      <div id="adminAlert" class="hidden p-3 rounded-xl text-xs font-semibold flex items-center gap-2"></div>

      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Admin Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-user-shield absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-600 text-xs"></i>
            <input type="email" id="adminEmail" required value="admin@vetportal.com"
              class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Admin Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-600 text-xs"></i>
            <input type="password" id="adminPassword" required value="admin123"
              class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          </div>
        </div>

        <button type="submit" id="adminLoginBtn"
          class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-950 transition-all flex items-center justify-center gap-2">
          <span>Authenticate as Administrator</span>
          <i class="fa-solid fa-right-to-bracket text-xs"></i>
        </button>
      </form>

    </div>
  </main>

  <footer class="p-6 text-center text-xs text-slate-600 border-t border-slate-900">
    Mafaza-tul-Hayat-al-Hewan System Administrator Console &copy; 2026. Strictly restricted access.
  </footer>

  <script src="/js/admin.js"></script>
</body>
</html>
