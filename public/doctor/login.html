<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Portal Login & Signup | Mafaza-tul-Hayat-al-Hewan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased">

  <!-- Header -->
  <header class="p-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold">
          <i class="fa-solid fa-staff-snake text-xl"></i>
        </div>
        <div>
          <span class="font-bold text-lg text-white">Mafaza-tul-Hayat-al-Hewan</span>
          <span class="text-[10px] block text-emerald-400 font-bold">DOCTOR AUTHENTICATION PORTAL</span>
        </div>
      </a>
      <a href="/" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1.5 bg-slate-800 px-3.5 py-2 rounded-lg">
        <i class="fa-solid fa-arrow-left"></i> Public Portal
      </a>
    </div>
  </header>

  <!-- Login & Signup Container -->
  <main class="max-w-md w-full mx-auto px-4 py-8">
    <div class="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl">
      
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center mx-auto text-emerald-400 text-2xl mb-3">
          <i class="fa-solid fa-user-md"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-white">Doctor Portal</h1>
        <p class="text-xs text-emerald-400 mt-1 font-medium">Log in or create a practitioner account</p>
      </div>

      <!-- Auth Toggle Tabs -->
      <div class="grid grid-cols-2 gap-1 bg-slate-900/80 p-1.5 rounded-xl mb-6 border border-slate-700/60">
        <button id="showLoginBtn" class="py-2.5 rounded-lg text-xs font-bold transition-all bg-emerald-600 text-white shadow">
          Doctor Login
        </button>
        <button id="showSignupBtn" class="py-2.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">
          Create Account
        </button>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2"></div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input type="email" id="loginEmail" required placeholder="dr.smith@vetclinic.com"
              class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
            <input type="password" id="loginPassword" required placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn"
          class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-900/40 transition-all flex items-center justify-center gap-2">
          <span>Login to Doctor Dashboard</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Full Name</label>
          <input type="text" id="signupName" required placeholder="Dr. Tariq Mahmood"
            class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
          <input type="email" id="signupEmail" required placeholder="dr.tariq@vetclinic.com"
            class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Clinic / Hospital</label>
            <input type="text" id="signupClinic" placeholder="Sunrise Vet Hospital"
              class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Specialization</label>
            <input type="text" id="signupSpec" placeholder="Livestock & Surgery"
              class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
          <input type="password" id="signupPassword" required placeholder="At least 6 characters"
            class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <button type="submit" id="signupSubmitBtn"
          class="w-full py-3 bg-teal-600 hover:bg-teal-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-teal-900/40 transition-all flex items-center justify-center gap-2">
          <span>Create Doctor Account</span>
          <i class="fa-solid fa-user-plus text-xs"></i>
        </button>
      </form>

    </div>
  </main>

  <footer class="p-6 text-center text-xs text-slate-500">
    Mafaza-tul-Hayat-al-Hewan Doctor Portal &copy; 2026. Restricted practitioner access.
  </footer>

  <script src="/js/doctor.js"></script>
</body>
</html>
